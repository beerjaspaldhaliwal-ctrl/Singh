name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: DSP unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DSAM_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  plugin:
    name: Plugin (${{ matrix.name }})
    needs: tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: SinghAIMixer-Windows-VST3
          - name: macOS
            os: macos-latest
            artifact: SinghAIMixer-macOS-VST3-AU
          - name: Linux
            os: ubuntu-latest
            artifact: SinghAIMixer-Linux-VST3
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSAM_BUILD_TESTS=OFF

      - name: Build VST3
        run: cmake --build build --config Release --target SinghAIMixer_VST3 --parallel 4

      - name: Build AU
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --target SinghAIMixer_AU --parallel 4

      - name: Validate with pluginval (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process \
            "build/SinghAIMixer_artefacts/Release/VST3/Singh AI Mixer.vst3"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -R "build/SinghAIMixer_artefacts/Release/VST3/Singh AI Mixer.vst3" dist/
          if [ -d "build/SinghAIMixer_artefacts/Release/AU" ]; then
            cp -R "build/SinghAIMixer_artefacts/Release/AU/Singh AI Mixer.component" dist/
          fi
          cp README.md dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" == "Windows" ]; then
            7z a "../${{ matrix.artifact }}.zip" .
          else
            zip -qry "../${{ matrix.artifact }}.zip" .
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
